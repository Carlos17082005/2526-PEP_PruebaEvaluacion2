<!-- templates/editar_resena.html -->
{% extends "base.html" %}

{% block content %}
    <div class="form-container">
        <!-- Vista previa de la reseña actual -->
        <div>
            <h3 class="autor_y_puntuacion">Autor: <span class="autor_colorido">{{ resena.autor }}</span></h3>
        </div>

        <form action="" method="post" enctype="multipart/form-data">{% csrf_token %}
            {{ form.as_p }}<br>
            <input type="submit" value="Guardar Cambios">
            <a href="{% url 'detalle_juego' resena.juego.pk %}"><button type="button" class="btn-cancel">Volver</button></a>
        </form>
    </div>
{% endblock content %}
