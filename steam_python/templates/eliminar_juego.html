<!-- eliminar_juego.html -->
{% extends "base.html" %}
{% block content %}

    <h1 class="tw-text-2xl tw-font-bold tw-mb-4">
        ¿Seguro que quieres eliminar
        <span class="tw-text-[#ef4444] tw-underline">{{ object.nombre_juego }}</span>?
    </h1>

    <img class="preview-img tw-w-full tw-max-w-[300px] tw-rounded-lg tw-mb-4 tw-border-2 tw-border-[#334155] tw-opacity-50"
         src="/media/{{ object.imagen }}"
         alt="(imagen del juego no disponible)">

    <form action="" method="post">{% csrf_token %}
        {{ form.as_p }}
        <div class="tw-flex tw-gap-2.5 tw-items-center tw-mt-5">
            <input type="submit"
                   value="Sí, borrar definitivamente"
                   class="btn-submit-danger tw-px-5 tw-py-2.5 tw-border-0 tw-rounded-lg tw-font-bold tw-cursor-pointer tw-bg-[#ef4444] tw-text-white">
            <a href="{% url 'detalle_juego' object.pk %}">
                <button type="button"
                        class="btn-cancel tw-px-5 tw-py-2.5 tw-border-0 tw-rounded-lg tw-font-bold tw-cursor-pointer tw-bg-[#94a3b8] tw-text-white">
                    Cancelar
                </button>
            </a>
        </div>
    </form>

{% endblock content %}
