<!-- eliminar_resena.html -->
{% extends "base.html" %}
{% block content %}

    <h1 class="tw-text-2xl tw-font-bold tw-mb-4">¿Seguro que quieres eliminar esta reseña?</h1>

    <!-- Vista previa de la reseña (atenuada) -->
    <div class="review-card tw-bg-[#151b2b] tw-p-6 tw-rounded-lg tw-mb-6 tw-opacity-50"
         style="border: 2px solid white; border-radius: 7px; width: 500px;">
        <div class="tw-flex tw-justify-between tw-items-center tw-mb-1">
            <h3 class="tw-text-[#00d2ff] tw-text-[1.1rem] tw-mb-0">Autor: {{ resena.autor }}</h3>
            <span class="tw-text-[#94a3b8] tw-text-xs">{{ resena.fecha_creacion|date:"d/m/Y" }}</span>
        </div>
        <h3 class="tw-flex tw-items-center tw-gap-2.5 tw-text-[#fbbf24] tw-text-[1.1rem] tw-font-bold tw-mb-4">
            Puntuación: {{ resena.puntuacion }}
        </h3>
        <p class="tw-text-[#e2e8f0] tw-leading-relaxed">{{ resena.cuerpo }}</p>
    </div>

    <form action="" method="post">{% csrf_token %}
        {{ form.as_p }}
        <div class="tw-flex tw-gap-2.5 tw-items-center tw-mt-5">
            <input type="submit"
                   value="Sí, borrar definitivamente"
                   class="btn-submit-danger tw-px-5 tw-py-2.5 tw-border-0 tw-rounded-lg tw-font-bold tw-cursor-pointer tw-bg-[#ef4444] tw-text-white">
            <a href="{% url 'detalle_juego' resena.juego.pk %}">
                <button type="button"
                        class="btn-cancel tw-px-5 tw-py-2.5 tw-border-0 tw-rounded-lg tw-font-bold tw-cursor-pointer tw-bg-[#94a3b8] tw-text-white">
                    Cancelar
                </button>
            </a>
        </div>
    </form>

{% endblock content %}
