<!-- templates/eliminar_resena.html -->
{% extends "base.html" %}

{% block content %}
    <h1>¿Seguro que quieres eliminar esta reseña?</h1>
    <br>

    <!-- Vista previa de la reseña a eliminar (atenuada) -->
    <div class="review-card review-card--preview-danger">
        <h3 class="autor_resena">Autor: {{ resena.autor }}</h3>
        <h3 class="puntuacion_resena">Puntuación: {{ resena.puntuacion }}</h3>
        <p class="texto_resena">{{ resena.cuerpo }}</p>
    </div>

    <form action="" method="post">{% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <input type="submit" value="Sí, borrar definitivamente" class="btn-submit-danger">
            <a href="{% url 'detalle_juego' resena.juego.pk %}"><button type="button" class="btn-cancel">Cancelar</button></a>
        </div>
    </form>
{% endblock content %}
