<!-- templates/eliminar_juego.html -->
{% extends "base.html" %}

{% block content %}
    <div class="form-container">
        <h1>Editar:  <span class="autor_colorido">{{ object.nombre_juego }}</span> </h1>
        <img src="/media/{{ object.imagen }}" alt="(imagen del juego no disponible)" class="preview-img">
        <form action="" method="post" enctype="multipart/form-data">{% csrf_token %}
            {{ form.as_p }} <br>
            <input type="submit" value="Guardar Cambios">
        </form>
        <a href="{% url 'detalle_juego' juego.pk %}"><button> Volver a Detalles </button></a>
    </div>
{% endblock content %}
