{% load static %}
<html>
    <head>
        <title>Django</title>
        <link rel="stylesheet" href="{% static 'css/base.css' %}" />
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
        tailwind.config = {
            prefix: 'tw-',
            corePlugins: { preflight: false },  /* tu reset en base.css manda */
            theme: {
                extend: {
                    colors: {
                        accent:  '#00d2ff',
                        'accent-hover': '#3a7bd5',
                        danger:  '#ef4444',
                        'bg-main':   '#0b0f19',
                        'bg-card':   '#151b2b',
                        'bg-header': '#111827',
                        'bg-subnav': '#0d1420',
                        'text-muted': '#94a3b8',
                    }
                }
            }
        }
        </script>
    </head>
    <body>

        <!-- ===== HEADER ===== -->
        <header class="tw-bg-[#111827] tw-px-8 tw-py-3 tw-flex tw-justify-between tw-items-center tw-shadow-lg tw-sticky tw-top-0 tw-z-[200] tw-border-b tw-border-[rgba(0,210,255,0.1)]">

            <div class="nav-left">
                <h1>
                    <a href="{% url 'home' %}"
                       class="tw-text-white tw-text-3xl tw-font-extrabold tw-tracking-widest tw-uppercase">
                        Steam Python
                    </a>
                </h1>
            </div>

            <div class="tw-flex tw-items-center tw-gap-3.5">
                {% if user.is_authenticated %}
                    <h2 class="tw-text-[0.95rem] tw-font-normal tw-text-[#94a3b8]">
                        Hola, <span class="tw-text-[#00d2ff] tw-font-bold">{{ user.username }}</span>
                    </h2>
                    <form action="{% url 'logout' %}" method="post" style="margin:0">
                        {% csrf_token %}
                        <button class="btn-logout tw-bg-transparent tw-border tw-border-[#00d2ff] tw-text-[#00d2ff] tw-px-4 tw-py-1 tw-rounded-lg tw-cursor-pointer tw-text-sm tw-font-semibold"
                                type="submit">Log Out</button>
                    </form>
                {% else %}
                    <a class="btn-auth tw-border tw-border-[#00d2ff] tw-text-[#00d2ff] tw-px-4 tw-py-1 tw-rounded-lg tw-text-sm tw-font-semibold"
                       href="{% url 'login' %}">Log In</a>
                    <a class="btn-auth tw-border tw-border-[#00d2ff] tw-text-[#00d2ff] tw-px-4 tw-py-1 tw-rounded-lg tw-text-sm tw-font-semibold"
                       href="{% url 'signup' %}">Sign Up</a>
                {% endif %}
            </div>
        </header>

        <!-- ===== SUBNAV ===== -->
        <nav class="subnav tw-bg-[#0d1420] tw-px-8 tw-py-2 tw-flex tw-items-center tw-gap-4 tw-border-b tw-border-white/5 tw-sticky tw-top-[60px] tw-z-[150] tw-shadow-md">
            <a href="{% url 'nuevo_juego' %}"
               class="tw-text-black tw-px-[18px] tw-py-[7px] tw-rounded-full tw-font-bold tw-text-[0.9rem]">
                + Añadir Juego
            </a>
        </nav>

        <!-- ===== ALERTAS ===== -->
        {% if messages %}
            <div class="tw-fixed tw-top-[70px] tw-left-1/2 tw--translate-x-1/2 tw-z-[300] tw-min-w-[300px]">
                {% for message in messages %}
                    <div class="tw-px-5 tw-py-3 tw-rounded-lg tw-bg-[rgba(58,123,213,0.9)] tw-text-white tw-text-center tw-shadow-lg tw-backdrop-blur-sm tw-whitespace-nowrap">
                        <script>alert("{{ message }}");</script>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- ===== CONTENIDO PRINCIPAL ===== -->
        <main class="tw-max-w-[1400px] tw-mx-auto tw-my-8 tw-px-6">
            {% block content %} {% endblock content %}
        </main>

    </body>
</html>
